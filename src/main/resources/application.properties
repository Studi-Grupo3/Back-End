# Application Configuration
spring.application.name=${APP_NAME:back-studi}

# Perfil ativo
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

# Upload directory
file.upload-dir=${FILE_UPLOAD_DIR:/app/uploads}

# Database Configuration
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/db_studi?createDatabaseIfNotExist=true}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# JPA Configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}

### AMAZON S3 ###
aws.s3.access-key-id=${AWS_S3_ACCESS_KEY_ID:da}
aws.s3.secret-access-key=${AWS_S3_SECRET_ACCESS_KEY:dasda}
aws.s3.region=${AWS_S3_REGION:us-east-1}
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:studi-profile-photos}

# Mercado Pago
mercadopago.access.token=${MERCADOPAGO_ACCESS_TOKEN:}

# Swagger
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.displayRequestDuration=true

# Upload limits
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Mail (for notifications from API)
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
contato.email.destino=${MAIL_CONTACT_DEST:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# API path
spring.mvc.servlet.path=/api

# Health check
app.health.enabled=true
app.version=${APP_VERSION:0.1.0}

# RabbitMQ (for sending messages to queue)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VIRTUAL_HOST:/}

logging.level.org.springframework.security=DEBUG
logging.level.sptech.school.v2.cleanarch=DEBUG
