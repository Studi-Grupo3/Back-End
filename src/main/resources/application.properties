spring.application.name=back-studi

# Ativando o perfil de desenvolvimento
spring.profiles.active=dev

# Descomente para entrar no perfil de produção
# spring.profiles.active=prod

### CONFIGURACAO DO AMAZON S3 ###
aws.s3.access-key-id=
aws.s3.secret-access-key=
aws.s3.region=us-east-1
aws.s3.bucket-name=studi-profile-photos
aws.s3.endpoint-override=

# Configurações de tamanho máximo de arquivo
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=867575
spring.mail.password=867575
contato.email.destino=teste@seudominio.com
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

### CONFIGURAÇÃO DO AZURE STORAGE ###
# 1. Separando account name e key em variáveis
azure.storage.account-name=studiarquivos
azure.storage.account-key=
  # 2. Montando a connection string usando as variáveis acima
azure.storage.connection-string=DefaultEndpointsProtocol=https;AccountName=${azure.storage.account-name};AccountKey=${azure.storage.account-key};EndpointSuffix=core.windows.net

# 3. Nome do container onde os blobs serão armazenados
azure.storage.container-name=meus-arquivos