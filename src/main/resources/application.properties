spring.application.name=back-studi

# Perfil ativo (ajuste conforme necessidade)
spring.profiles.active=${SPRING_ACTIVE_PROFILE:dev}

file.upload-dir=${FILE_UPLOAD_DIR:C:\\studi-contents}

### CONFIGURACAO DO AMAZON S3 ###
aws.s3.access-key-id=teste
aws.s3.secret-access-key=banana
aws.s3.region=us-east-1
aws.s3.bucket-name=studi-profile-photos

# Configurações de tamanho máximo de arquivo
# Mercado Pago via vari�vel de ambiente
mercadopago.access.token=${MERCADOPAGO_ACCESS_TOKEN:}

# Swagger
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.displayRequestDuration=true

# Upload limits
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Mail (usar provider real ou Mailtrap em dev)
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
contato.email.destino=${MAIL_CONTACT_DEST:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true


# Config para padronizar /api para todos endpoints
spring.mvc.servlet.path=/api

# Health check configuration
app.health.enabled=true
app.version=0.1.0
